name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy-client:
    name: Deploy Client
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        working-directory: client
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_CLIENT_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_CLIENT_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}

      - name: Build project artifacts
        working-directory: client
        run: vercel build --prod --token=${{ secrets.VERCEL_CLIENT_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_CLIENT_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: client
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_CLIENT_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_CLIENT_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_CLIENT_PROJECT_ID }}

  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        working-directory: server
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_SERVER_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_SERVER_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}

      # server/vercel.json uses the legacy `builds`/`routes` format (a plain
      # Express app with app.listen(), not an exported handler), which isn't
      # compatible with the newer `vercel build` + `--prebuilt` Build Output
      # API flow the client uses - Vercel needs to build this one remotely.
      - name: Deploy to Vercel
        working-directory: server
        run: vercel deploy --prod --token=${{ secrets.VERCEL_SERVER_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_SERVER_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_SERVER_PROJECT_ID }}
